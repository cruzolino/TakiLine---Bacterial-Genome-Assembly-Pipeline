# TakiLine — pinned conda environment (core)
#
# Covers: Illumina/hybrid/PacBio-HiFi assembly (spades/skesa/unicycler/flye/
# canu/raven), QC, polishing, species ID, and all optional typing/resistance
# flags (--plasmid/--amr/--abricate/--mlst).
#
# Does NOT include medaka or trycycler — see environment-medaka.yml and
# environment-trycycler.yml, and the note in README.md's "Species
# identification"/Installation sections on why those are split out.
#
# Provenance of these pins:
#   - Most versions below were read directly from the `takiline_test` conda
#     env already on this machine (conda list -n takiline_test) — i.e. real,
#     already-proven-to-co-install versions, not guesses.
#   - kraken2, skesa, checkm2, busco, ncbi-amrfinderplus, abricate, and mlst
#     were NOT found installed anywhere on this machine. Those seven are
#     pinned to bioconda's current published version instead (checked
#     2026-08-18) and have NOT been verified to solve together with the rest
#     in one `conda env create` pass. If the solve fails or hangs, install
#     them individually into the built env instead:
#       conda install -n takiline -c bioconda kraken2=2.17.1
#     (repeat per package) — bioconda solves are generally more reliable
#     incrementally than in one large batch.
#
# To (re)create: conda env create -f environment.yml
# To update a pin deliberately: edit the version here, then
#   conda env update -f environment.yml --prune
name: takiline
channels:
  - bioconda
  - conda-forge
dependencies:
  # Mandatory (all modes)
  - fastqc=0.12.1
  - fastp=1.3.6
  - quast=5.3.0

  # Species identification (required unless -S is given) — NOT in takiline_test; unverified combined solve
  - kraken2=2.17.1

  # Illumina / Hybrid
  - bowtie2=2.5.5
  - samtools=1.24
  - pilon=1.24

  # Long-read / Hybrid (filtering only — medaka is in environment-medaka.yml)
  - filtlong=0.3.1

  # Assemblers (all except trycycler, which needs its own env — see above)
  - spades=4.3.0
  - skesa=2.5.1          # NOT in takiline_test; unverified combined solve
  - unicycler=0.5.1
  - flye=2.9.6
  - canu=2.2
  - raven-assembler=1.8.3
  - miniasm=0.3
  - minimap2=2.31

  # QC / completeness (multiqc is pinned via pip below — on this machine's
  # solve, bioconda resolved it from PyPI rather than the bioconda channel)
  - nanoplot=1.47.1
  - seqkit=2.13.0
  - assembly-stats=1.0.1
  - checkm2=1.1.0        # NOT in takiline_test; unverified combined solve
  - busco=6.1.0          # NOT in takiline_test; unverified combined solve
  - pigz=2.8

  # Optional typing/resistance analyses (--plasmid/--amr/--abricate/--mlst)
  - plasmidfinder=2.1.6
  - ncbi-amrfinderplus=4.2.7   # NOT in takiline_test; unverified combined solve
  - abricate=1.4.0             # NOT in takiline_test; unverified combined solve
  - mlst=2.35.0                # NOT in takiline_test; unverified combined solve

  - pip
  - pip:
    - multiqc==1.35
