# TakiLine — Canu assembly (`-a canu`) env
#
# Kept separate: canu's boost-cpp dependency tops out at icu<=75, but the
# core takiline env pins icu=78.3 (pulled in by quast/samtools's own deps) —
# no canu 2.3 build resolves against that. Same category of conflict that
# already forced medaka/trycycler/typing/busco/checkm2 into their own envs.
#
# Usage: `conda run -n takiline-canu canu ...`
#
# To create: conda env create -f environment-canu.yml
name: takiline-canu
channels:
  - bioconda
  - conda-forge
dependencies:
  - canu=2.3
