# TakiLine — pinned conda environment (core)
#
# Covers: Illumina/hybrid/PacBio-HiFi assembly, QC, polishing, and
# --plasmid/--amr typing. Excludes medaka/trycycler/canu (own env each — see
# environment-medaka.yml, environment-trycycler.yml, environment-canu.yml)
# and abricate/mlst (environment-typing.yml — conflicts with samtools here).
#
# samtools=1.24 is required, not cosmetic: Pilon polishing calls
# `samtools sort -@ N -o file.bam`, which samtools <1.0 doesn't support.
#
# Polypolish is the default Illumina/hybrid polisher; bowtie2/samtools/pilon
# are kept for the legacy --pilon path.
#
# python=3.12 pinned explicitly: without it the solver can land on python=3.13,
# which breaks quast (uses the stdlib `distutils`, removed in 3.12+) and has no
# unicycler=0.5.1 build at all (bioconda never rebuilt it past py312).
#
# plotly=6.1.1 pinned explicitly (conda AND pip, below): nanoplot declares
# plotly>=6.1.1 with no upper bound, but actually needs the bottom of that
# range — plotly>=6.2 already dropped figure_factory.create_2d_density, which
# nanoplot's KDE plot calls directly. Needed in both places because multiqc
# stays on pip (see below) and its own pip install would otherwise re-pull an
# unconstrained, newer, breaking plotly.
#
# multiqc via pip, not conda: multiqc's conda build pins python-kaleido==0.2.1
# exactly, but nanoplot needs python-kaleido>=1.0.0 — hard conflict, no
# version of either package resolves it. pip's multiqc has no such conda-level
# constraint, so it coexists once plotly is re-pinned (below) after it installs.
#
# Not included: checkm2, busco, canu (need their own env each — canu's
# boost-cpp needs icu<=75, but something else here pins icu=78.3; checkm2/busco
# conflict with samtools=1.24 — see README).
#
# To (re)create: conda env create -f environment.yml
name: takiline
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.12
  - plotly=6.1.1

  # Mandatory (all modes)
  - fastqc=0.12.1
  - fastp=1.3.6
  - quast=5.3.0

  # Species identification (required unless -S is given, or --verify-species is used)
  - kraken2=2.17.1

  # Illumina / Hybrid
  - bwa=0.7.19
  - polypolish=0.7.1
  - bowtie2=2.5.5
  - samtools=1.24
  - pilon=1.24

  # Long-read / Hybrid (filtering only — medaka is in environment-medaka.yml)
  - filtlong=0.3.1

  # Assemblers (all except trycycler/canu, which need their own env)
  - spades=4.3.0
  - skesa=2.5.1
  - unicycler=0.5.1=py312hdcc493e_5   # build pinned: older 0.5.1 builds need spades<4, conflicts with spades=4.3.0 above
  - flye=2.9.6
  - raven-assembler=1.8.3
  - miniasm=0.3
  - minimap2=2.31

  # QC / completeness
  - nanoplot=1.48.0
  - seqkit=2.13.0
  - assembly-stats=1.0.1
  - pigz=2.8

  # Optional typing/resistance analyses (--plasmid/--amr)
  - plasmidfinder=2.1.6
  - ncbi-amrfinderplus=4.2.7

  - pip
  - pip:
    - multiqc==1.35
    - plotly==6.1.1   # re-pin after multiqc — see plotly/multiqc note above
