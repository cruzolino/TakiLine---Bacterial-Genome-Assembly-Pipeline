# TakiLine — Medaka polishing (separate env)
#
# medaka is kept out of environment.yml deliberately: it was found installed
# in its own dedicated conda env on this machine (test_medaka), not alongside
# the rest of TakiLine's tools — real, existing evidence that combining it
# into the main env is not something already proven to work here.
#
# TakiLine's Nanopore polishing step (medaka_consensus) only ever runs after
# assembly has finished, as a separate process, so it does not need to be on
# the same $PATH as the assemblers within a single takiline.sh invocation —
# unlike Trycycler (see environment-trycycler.yml), a separate env is a
# clean fit here, not a workaround.
#
# Usage: activate this env only for the polishing step, e.g. by running
# takiline.sh with `conda run -n takiline-medaka medaka_consensus ...`
# wired in, or by conda-activating it manually around that stage.
#
# To create: conda env create -f environment-medaka.yml
name: takiline-medaka
channels:
  - bioconda
  - conda-forge
dependencies:
  - medaka=2.2.2
